<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verification queue &middot; Kampala Intelligence Platform</title>
    <!-- appearance read before paint, so a dark-mode visitor gets no flash -->
    <script>
      try {
        var t = localStorage.getItem('kip-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>

    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/theme.css" />
    <style>
      /*
       * A work surface, not a website. The operator is looking at a queue and
       * making one decision at a time, so the layout is: a quiet header, the
       * queue, and a command bar that stays put at the bottom because the
       * reason field and the decision buttons belong together and belong
       * reachable without scrolling back up.
       */

      .who {
        display: flex;
        align-items: center;
        gap: var(--s3);
        font-size: 0.875rem;
        color: var(--muted);
      }

      /* Sign-in is a card, because it is the one moment on this page the
         operator arrives with nothing to do. */
      .gate {
        max-width: 22rem;
        margin: var(--s7) auto;
        padding: var(--s5);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
      }

      .gate p {
        color: var(--muted);
        font-size: 0.9375rem;
        margin: var(--s2) 0 var(--s4);
      }

      .gate form {
        display: grid;
        gap: var(--s3);
      }

      /* The queue header sticks, so the filter and the count stay in view
         while you work down a long list. */
      .queue-head {
        position: sticky;
        top: 3.25rem;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: var(--s3);
        flex-wrap: wrap;
        padding: var(--s4) 0;
        margin-bottom: var(--s3);
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }

      .queue-head h2 {
        margin-right: auto;
      }

      #queue-count {
        font-size: 0.9375rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .queue-head .filter {
        display: flex;
        align-items: center;
        gap: var(--s2);
      }

      .queue-head .filter select {
        width: auto;
        min-width: 12rem;
        margin-top: 0;
      }

      #queue-problem {
        margin-bottom: var(--s3);
      }

      /* The rows the script builds are laid out in theme.css now, next to the
         directory's .card. They used to be a two-column grid here, which was
         written before the script started wrapping the name and its facts in a
         single <div>; the grid kept dropping the badges onto rows of their
         own. The wrapper still has no class, so theme.css reaches it as
         `.row > div`. */

      /* A decision is a choice between named states, so the buttons read as
         states rather than as generic actions. */
      #actions {
        display: flex;
        gap: var(--s2);
        flex-wrap: wrap;
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }

      #actions button[aria-pressed='true'] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
      }

      /* The command bar. Sticky, because the reason for a decision is part of
         the decision and should never be something you scroll away from. */
      .bar {
        position: sticky;
        bottom: 0;
        z-index: 15;
        display: flex;
        align-items: center;
        gap: var(--s3);
        flex-wrap: wrap;
        padding: var(--s4) var(--s5);
        margin-top: var(--s6);
        background: color-mix(in srgb, var(--card) 94%, transparent);
        backdrop-filter: saturate(1.6) blur(10px);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-pop);
      }

      .selection {
        font-weight: 600;
        font-size: 0.9375rem;
        min-width: 12rem;
      }

      .bar .reason {
        display: flex;
        align-items: center;
        gap: var(--s2);
        flex: 1 1 18rem;
        min-width: 0;
      }

      .bar .reason input {
        margin-top: 0;
        flex: 1 1 auto;
      }

      .outcome {
        flex: 1 1 100%;
        font-size: 0.875rem;
        color: var(--muted);
      }

      .outcome:empty {
        display: none;
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="wordmark" href="/">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
          Kampala Intelligence
        </a>
        <nav class="topnav">
          <a href="/">Engine</a>
          <a href="/directory.html">Directory</a>
          <a href="/operator.html" aria-current="page">Verification queue</a>
          <button class="theme-toggle" type="button" hidden>
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </nav>
        <div class="who" id="who" hidden>
          <span id="who-name"></span>
          <button type="button" class="quiet" id="sign-out">Sign out</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="gate" id="gate" hidden>
        <h2>Sign in</h2>
        <p>Accounts are created by an admin through the admin API. There is no public sign-up.</p>
        <form id="sign-in-form" novalidate>
          <label>
            Email
            <input type="email" id="email" name="email" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit" id="sign-in">Sign in</button>
          <p class="problem" id="gate-problem" role="alert"></p>
        </form>
      </section>

      <section id="queue" hidden>
        <div class="queue-head">
          <h2>Awaiting a decision</h2>
          <p id="queue-count"></p>
          <label class="filter">
            Show
            <select id="state-filter">
              <option value="">everything in review</option>
              <option value="imported">just imported</option>
              <option value="pending_review">waiting for review</option>
              <option value="under_review">being checked</option>
              <option value="verified">verified, not yet published</option>
              <option value="approved">approved</option>
              <option value="rejected">rejected</option>
            </select>
          </label>
          <button type="button" class="quiet" id="refresh">Refresh</button>
        </div>
        <p class="problem" id="queue-problem" role="alert"></p>
        <ul class="rows" id="rows"></ul>
        <p class="empty" id="empty" hidden>
          Nothing is waiting. Every listing that has been surveyed has a decision against it.
        </p>
      </section>
    </main>

    <div class="shell">
      <div class="bar" id="bar" hidden>
        <p class="selection" id="selection">Nothing selected</p>

        <fieldset class="states" id="actions">
          <legend hidden>Decision</legend>
        </fieldset>

        <button type="button" id="record" disabled>Record decision</button>

        <label class="reason">
          Why
          <input
            type="text"
            id="reason"
            maxlength="500"
            autocomplete="off"
            placeholder="Walked Nakawa on 25 September; the owner confirmed the shop is there and trades."
          />
        </label>

        <p class="outcome" id="outcome" role="status" aria-live="polite"></p>
      </div>
    </div>

    <script src="/theme.js"></script>
    <script>
      /*
       * The session cookie is HttpOnly, so nothing here ever holds a token: the
       * sign-in POST sets the cookie and every later call is a plain same-origin
       * fetch. That is the whole reason this page can be a static file.
       *
       * Every value that came from a survey file is written with textContent and
       * never with innerHTML. A business name is operator-typed text from a CSV,
       * which is exactly the kind of string that must not be able to become
       * markup in the one screen an operator trusts.
       */
      const gate = document.getElementById('gate')
      const queue = document.getElementById('queue')
      const bar = document.getElementById('bar')
      const rows = document.getElementById('rows')
      const empty = document.getElementById('empty')
      const who = document.getElementById('who')
      const reasonInput = document.getElementById('reason')
      const recordButton = document.getElementById('record')
      const outcome = document.getElementById('outcome')
      const PAGE = 25

      const state = {
        user: null,
        /**
         * The capabilities the server reported for this session, read from
         * /auth/me rather than restated here. A copy of the role table in this
         * file would be a second definition that drifts from core/auth.js, and the
         * operator who trusted it would press a button the server refuses.
         */
        capabilities: new Set(),
        items: [],
        selected: new Set(),
        canDecide: true,
        state: '',
        categoryNames: new Map(),
        locationNames: new Map(),
      }

      /** The decisions that change whether the public can see a listing at all. */
      const PUBLISHING = new Set(['approve', 'unapprove'])

      /**
       * Whether this session may take an action, judged against the server's own
       * answer rather than a role name. The server still checks; this only decides
       * what to offer.
       */
      const may = (capability) => state.capabilities.has(capability)

      /** One request helper, so every call agrees on credentials and errors. */
      async function api(path, options = {}) {
        const response = await fetch(path, {
          credentials: 'same-origin',
          headers: { accept: 'application/json', ...(options.body ? { 'content-type': 'application/json' } : {}) },
          ...options,
          body: options.body ? JSON.stringify(options.body) : undefined,
        })
        const payload = await response.json().catch(() => ({}))
        if (!response.ok) {
          const error = new Error(payload?.error?.message ?? 'The request could not be completed.')
          error.status = response.status
          throw error
        }
        return payload
      }

      /*
       * Reference names. The queue row carries a category id and a location id,
       * and an id is not something a reviewer can decide from, so the two public
       * reference trees are fetched once and held as id -> name. 32 locations and
       * 90 categories: cheap, cacheable, and no reason to add a join to the list
       * query for the sake of one page.
       */
      async function loadReferenceNames() {
        const [categories, locations] = await Promise.all([
          api('/api/v1/categories').catch(() => null),
          api('/api/v1/locations?limit=500').catch(() => null),
        ])
        const flatten = (nodes) => {
          for (const node of nodes ?? []) {
            state.categoryNames.set(node.id, node.name)
            flatten(node.children)
          }
        }
        flatten(categories?.data)
        for (const location of locations?.data ?? []) {
          state.locationNames.set(location.id, location.name)
        }
      }

      const say = (element, message) => {
        element.textContent = message ?? ''
      }

      /* --- signing in and out ------------------------------------------- */

      document.getElementById('sign-in-form').addEventListener('submit', async (event) => {
        event.preventDefault()
        const button = document.getElementById('sign-in')
        const problem = document.getElementById('gate-problem')
        say(problem, '')
        button.disabled = true
        try {
          await api('/api/v1/auth/login', {
            method: 'POST',
            body: {
              email: document.getElementById('email').value.trim(),
              password: document.getElementById('password').value,
            },
          })
          // The password has done its job. Nothing keeps a copy of it.
          document.getElementById('password').value = ''
          await enter()
        } catch (error) {
          say(problem, error.message)
        } finally {
          button.disabled = false
        }
      })

      document.getElementById('sign-out').addEventListener('click', async () => {
        try {
          await api('/api/v1/auth/logout', { method: 'POST' })
        } catch {
          // A session that is already gone is the state we wanted anyway.
        }
        state.user = null
        showGate()
      })

      /* --- the queue ---------------------------------------------------- */

      function showGate() {
        gate.hidden = false
        queue.hidden = true
        bar.hidden = true
        who.hidden = true
        say(outcome, '')
        document.getElementById('password').focus()
      }

      async function enter() {
        try {
          const me = await api('/api/v1/auth/me')
          state.user = me.data.user
          state.capabilities = new Set(me.data.capabilities ?? [])
        } catch (error) {
          if (error.status === 401) {
            showGate()
            return
          }
          say(document.getElementById('gate-problem'), error.message)
          showGate()
          return
        }
        gate.hidden = true
        queue.hidden = false
        bar.hidden = false
        who.hidden = false
        say(document.getElementById('who-name'), `${state.user.displayName} (${state.user.role})`)
        // Saying up front what this account cannot do is better than letting an
        // operator fill in a reason, press the button, and be refused.
        if (!may('business:verify')) {
          state.canDecide = false
          say(
            document.getElementById('who-name'),
            `${state.user.displayName} (${state.user.role}) — read only`,
          )
        } else if (!may('business:publish')) {
          say(
            document.getElementById('who-name'),
            `${state.user.displayName} (${state.user.role}) — can verify, cannot publish`,
          )
        }
        await Promise.all([loadReferenceNames(), loadQueue()])
        reasonInput.focus()
      }

      async function loadQueue() {
        const problem = document.getElementById('queue-problem')
        say(problem, '')
        try {
          // The catalogue queue, not the admin business list. It answers the
          // question this screen exists to ask: what arrived, from where, how far
          // through review it is, and what may be done to it next. It also hands
          // over the legal actions per row, so this file does not carry a second
          // copy of the state machine.
          const filter = state.state ? `&state=${encodeURIComponent(state.state)}` : ''
          const page = await api(`/api/v1/admin/catalogue/queue?limit=${PAGE}${filter}`)
          state.items = page.data
          state.selected.clear()
          const counts = page.meta.counts ?? {}
          const backlog = ['imported', 'pending_review', 'under_review', 'verified']
            .map((step) => `${counts[step] ?? 0} ${step.replace(/_/g, ' ')}`)
            .join(' · ')
          say(document.getElementById('queue-count'), `${backlog}`)
          renderRows()
          updateBar()
        } catch (error) {
          if (error.status === 401) {
            showGate()
            return
          }
          // A role that cannot read businesses gets told so, and is not left
          // staring at an empty queue that looks like good news.
          say(problem, error.message)
          say(document.getElementById('queue-count'), '')
          state.items = []
          renderRows()
          updateBar()
        }
      }

      document.getElementById('refresh').addEventListener('click', loadQueue)

      document.getElementById('state-filter').addEventListener('change', (event) => {
        state.state = event.target.value
        loadQueue()
      })

      function renderRows() {
        rows.replaceChildren()
        empty.hidden = state.items.length > 0
        for (const item of state.items) {
          rows.append(buildRow(item))
        }
      }

      function buildRow(item) {
        const row = document.createElement('li')
        row.className = 'row'

        const box = document.createElement('input')
        box.type = 'checkbox'
        box.setAttribute('aria-label', `Select ${item.name}`)
        box.addEventListener('change', () => {
          if (box.checked) state.selected.add(item.id)
          else state.selected.delete(item.id)
          updateBar()
        })

        const body = document.createElement('div')

        const name = document.createElement('p')
        name.className = 'name'
        name.textContent = item.name
        body.append(name)

        // What kind of business it is, and where. A reviewer is deciding whether a
        // listing is true, and a computer repair shop in Wakiso is a different claim
        // from one in Nansana, so this is not decoration either.
        const where = document.createElement('p')
        where.className = 'where'
        const category = state.categoryNames.get(item.categoryId)
        const place = state.locationNames.get(item.primaryLocationId)
        const bits = []
        if (category) bits.push({ text: category })
        else if (item.categoryId) bits.push({ text: 'Unfiled category', absent: true })
        else bits.push({ text: 'No category', absent: true })
        if (place) bits.push({ text: place })
        bits.forEach((bit, index) => {
          if (index > 0) {
            const rule = document.createElement('span')
            rule.className = 'rule'
            rule.setAttribute('aria-hidden', 'true')
            where.append(rule)
          }
          const span = document.createElement('span')
          if (bit.absent) span.className = 'absent'
          span.textContent = bit.text
          where.append(span)
        })
        body.append(where)

        // Where it came from, and how far that source is trusted. A reviewer
        // deciding whether a listing is true is partly deciding whether the
        // source is, so both are on the row rather than one page away.
        const origin = document.createElement('p')
        origin.className = 'where'
        const sourceText = document.createElement('span')
        sourceText.textContent = item.sourceName ?? 'No source recorded'
        if (!item.sourceName) sourceText.className = 'absent'
        const trust = document.createElement('span')
        trust.className = 'tag'
        trust.textContent = item.sourceTrustLevel ?? 'unattributed'
        const label = document.createElement('span')
        label.className = 'kind'
        label.textContent = item.stateLabel ?? item.verificationState
        origin.append(sourceText, trust, label)
        body.append(origin)

        if (item.ownerName) {
          const claimed = document.createElement('p')
          claimed.className = 'none'
          claimed.textContent = `Claimed by ${item.ownerName}.`
          body.append(claimed)
        }

        row.append(box, body)
        return row
      }

      /* --- the decision ------------------------------------------------- */

      /**
       * The actions that are legal for every selected row, and that this session is
       * allowed to take.
       *
       * The intersection, not the union. A batch of three where only two can be
       * rejected is not a batch of three, and offering the button anyway would mean
       * the operator reads "rejected 3" from a response that says "refused 1" — so
       * the server would report it, but the screen should not have offered it.
       */
      function availableActions() {
        const rows = state.items.filter((item) => state.selected.has(item.id))
        if (rows.length === 0) return []
        return rows
          .reduce((shared, row) => {
            const actions = row.availableActions ?? []
            return shared === null ? actions : shared.filter((action) => actions.includes(action))
          }, null)
          .filter((action) => {
            if (!may('business:verify')) return false
            if (PUBLISHING.has(action)) return may('business:publish')
            return true
          })
      }

      const ACTION_LABELS = {
        claim: 'Take it',
        verify: 'Verified the facts',
        approve: 'Approve and publish',
        unapprove: 'Withdraw from the directory',
        reject: 'Reject',
        submit: 'Send back to review',
        reopen: 'Reopen',
        archive: 'Archive',
        restore: 'Restore',
      }

      /** Redraws the decision buttons for whatever is selected right now. */
      function renderActions() {
        const holder = document.getElementById('actions')
        const chosen = chosenAction()
        holder.replaceChildren()
        for (const action of availableActions()) {
          const label = document.createElement('label')
          const input = document.createElement('input')
          input.type = 'radio'
          input.name = 'action'
          input.value = action
          input.checked = action === chosen
          label.append(input, document.createTextNode(` ${ACTION_LABELS[action] ?? action}`))
          holder.append(label)
        }
        if (availableActions().length === 0) {
          const none = document.createElement('p')
          none.className = 'none'
          none.textContent = state.selected.size
            ? 'No single decision applies to every selected listing.'
            : 'Select the listings this decision applies to.'
          holder.append(none)
        }
      }

      function chosenAction() {
        const picked = document.querySelector('input[name="action"]:checked')
        return picked ? picked.value : null
      }

      function updateBar() {
        const count = state.selected.size
        const label = document.getElementById('selection')
        label.replaceChildren()
        if (count === 0) {
          label.append('Select the listings this decision applies to.')
        } else {
          const strong = document.createElement('b')
          strong.textContent = String(count)
          label.append(strong, ` listing${count === 1 ? '' : 's'} selected`)
        }
        // A decision that has been picked before a different selection was made may
        // no longer be legal, so the buttons are rebuilt from the current selection
        // and the button follows what they allow.
        renderActions()
        const ready =
          count > 0 && chosenAction() !== null && reasonInput.value.trim().length >= 3
        recordButton.disabled = !ready || !state.canDecide
      }

      document.getElementById('actions').addEventListener('change', updateBar)
      reasonInput.addEventListener('input', updateBar)
      reasonInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !recordButton.disabled) {
          event.preventDefault()
          record()
        }
      })

      recordButton.addEventListener('click', () => {
        record()
      })

      async function record() {
        if (recordButton.disabled) return
        const ids = state.items
          .map((item) => item.id)
          .filter((id) => state.selected.has(id))
        const action = chosenAction()
        const reason = reasonInput.value.trim()

        recordButton.disabled = true
        say(outcome, 'Recording…')
        try {
          const result = await api('/api/v1/admin/businesses/verification', {
            method: 'POST',
            body: { ids, action, reason },
          })
          const { updated, unchanged, missing, refused } = result.data.counts
          const parts = [`Recorded ${updated} decision${updated === 1 ? '' : 's'}.`]
          // The other outcomes are reported rather than hidden: a retry that
          // changed nothing is information, and a refusal means the server
          // disagreed with this screen, which is worth seeing plainly.
          if (unchanged > 0) parts.push(`${unchanged} already in that state.`)
          if (refused > 0) parts.push(`${refused} refused by the server.`)
          if (missing > 0) parts.push(`${missing} no longer exist.`)
          say(outcome, parts.join(' '))
          reasonInput.value = ''
          await loadQueue()
        } catch (error) {
          if (error.status === 401) {
            showGate()
            return
          }
          if (error.status === 403) {
            // The server is the authority on what a role may do; take its word,
            // stop offering the control, and do not carry a capability table in
            // this file that could drift from the one in core/auth.js.
            state.canDecide = false
            say(outcome, error.message)
          } else {
            say(outcome, error.message)
          }
          updateBar()
        } finally {
          updateBar()
        }
      }

      /* --- start -------------------------------------------------------- */

      loadReferenceNames().catch(() => {})
      enter()
    </script>
  </body>
</html>
