<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reviews &middot; Kampala Intelligence Platform</title>
    <script>
      try {
        var t = localStorage.getItem('kip-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/theme.css" />
    <style>
      .review {
        border-bottom: 1px solid var(--line);
        padding: var(--s4) 0;
      }
      .review:last-child { border-bottom: 0; }
      .head { display:flex; gap:var(--s3); align-items:baseline; flex-wrap:wrap; margin-bottom:var(--s2); }
      .name { font-weight: 600; }
      .meta { color: var(--muted); font-size: 0.8125rem; }
      .title { font-weight: 600; margin-bottom: var(--s1); }
      .body { max-width: 44rem; text-wrap: pretty; }
      .actions { display:flex; gap:var(--s2); margin-top:var(--s3); flex-wrap:wrap; }
      .reason { margin-top: var(--s2); }
      #signin { max-width: 28rem; }
      #queue { margin-top: var(--s5); }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="wordmark" href="/"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Kampala Intelligence</a>
        <nav class="topnav">
          <a href="/">Engine</a>
          <a href="/directory.html">Directory</a>
          <a href="/insights.html">Gaps</a>
          <a href="/requests.html">Requests</a>
          <a href="/ask.html">Ask</a>
          <a href="/second-life.html">Second Life</a>
          <a href="/claim.html">Claim</a>
          <a href="/my-business.html">My business</a>
          <a href="/operator.html">Verification queue</a>
          <a href="/reviews.html" aria-current="page">Reviews</a><a href="/photos.html">Photos</a><a href="/lab.html">Lab</a>
          <button class="theme-toggle" type="button" hidden><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg></button>
        </nav>
      </div>
    </header>
    <main class="shell">
      <div class="masthead"><div><h1>Review moderation</h1><p class="sub">Publish or reject what people have said.</p></div></div>
      <section class="panel" id="signin"><h2>Sign in</h2><form class="form" id="signin-form"><label>Email</label><input type="email" name="email" required autocomplete="email" /><label>Password</label><input type="password" name="password" required autocomplete="current-password" /><button type="submit" class="btn-primary">Sign in</button><p class="status bad" id="signin-error" hidden></p></form></section>
      <section id="queue" hidden><div id="reviews"></div></section>
    </main>
    <script src="/theme.js"></script>
    <script>
      const API='/api/v1'
      const els={signin:document.getElementById('signin'),form:document.getElementById('signin-form'),err:document.getElementById('signin-error'),queue:document.getElementById('queue'),reviews:document.getElementById('reviews')}
      let token=null
      async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{accept:'application/json','Content-Type':opts.body?'application/json':undefined,...(token?{authorization:`Bearer ${token}`}:{}),...opts.headers},...opts});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j?.error?.message||'Request failed');e.status=r.status;throw e}return j}
      els.form.onsubmit=async e=>{e.preventDefault();els.err.hidden=true;try{const f=new FormData(els.form);const b=await api(`${API}/auth/login`,{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});token=b.data.token;els.signin.hidden=true;els.queue.hidden=false;load()}catch(err){els.err.textContent=err.message;els.err.hidden=false}}
      async function load(){const r=await api(`${API}/admin/reviews?status=pending&sort=oldest&limit=100`);els.reviews.replaceChildren();for(const rev of r.data||[]){els.reviews.append(render(rev))}}
      function render(rev){const d=document.createElement('div');d.className='review';d.innerHTML=`<div class="head"><span class="name">${escape(rev.authorName||'Anonymous')}</span><span class="meta">${rev.status}</span><span class="meta">${rev.createdAt?.slice(0,10)}</span><span class="meta">${escape(rev.businessName||rev.businessSlug||'')}</span></div>${rev.title?`<div class="title">${escape(rev.title)}</div>`:''}${rev.body?`<div class="body">${escape(rev.body)}</div>`:''}<div class="actions"><button data-act="publish">Publish</button><button data-act="reject" class="quiet">Reject</button><button data-act="delete" class="quiet">Delete</button></div><input type="text" class="reason" placeholder="Reason (required for publish/reject)" maxlength="500" />`;const reason=d.querySelector('.reason');d.querySelector('[data-act=publish]').onclick=async()=>{await api(`${API}/admin/reviews/${rev.id}`,{method:'PATCH',body:JSON.stringify({decision:'publish',reason:reason.value})});d.remove()};d.querySelector('[data-act=reject]').onclick=async()=>{await api(`${API}/admin/reviews/${rev.id}`,{method:'PATCH',body:JSON.stringify({decision:'reject',reason:reason.value})});d.remove()};d.querySelector('[data-act=delete]').onclick=async()=>{if(confirm('Delete this review?')){await api(`${API}/admin/reviews/${rev.id}`,{method:'DELETE'});d.remove()}};return d}
      function escape(s){const div=document.createElement('div');div.textContent=s||'';return div.innerHTML}
    </script>
  </body>
</html>
