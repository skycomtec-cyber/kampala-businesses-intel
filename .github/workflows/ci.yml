# Kampala Businesses Intel - continuous integration
#
# Three jobs, in the order they fail:
#
#   1. test        - the suite, on the Node versions this supports.
#   2. config      - .env.example still matches src/config.js. Separate from the
#                    test run because it fails on a documentation drift rather
#                    than on code, and conflating the two makes the cause harder
#                    to see in the log.
#   3. image       - the Dockerfile builds and the container answers its own
#                    healthcheck. The last one that can be done without a host.
#
# Scheduled as well as push: a platform that seeds itself, imports and runs a
# nightly engine has code paths that only execute once a day in production, so a
# suite that only runs on push misses a class of breakage entirely.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 04:17 UTC. Nightly rather than on a cron that lands on :00, when every other
  # workflow on the platform is also queued.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# A new push to the same branch cancels the run in flight. On a busy branch this
# is the difference between one test run and thirty queued ones, and it is safe
# here because nothing in the suite deploys anything.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_MIN: '20.11'

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Not fail-fast. A failure on one version is a fact about that version, and
      # cancelling the others hides whether it is a regression across all of them
      # or a version-specific break.
      fail-fast: false
      matrix:
        # 20 is the floor in package.json engines. 22 is what the Dockerfile
        # ships. The tip catches a deprecation before it becomes one here.
        node: ['20.11', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly the lockfile and fails
      # when package.json and the lockfile disagree, which is what should happen
      # when a dependency is added without committing the lockfile.
      - name: Install
        working-directory: app
        run: npm ci

      # The native module has to load, and it has to load before the suite starts.
      # A missing or mismatched binary otherwise surfaces as an unrelated
      # SQLITE_ERROR partway through a run, on whichever test happens to touch the
      # database first.
      - name: Confirm the native module loads
        working-directory: app
        run: node -e "new (require('better-sqlite3'))(':memory:').close(); console.log('better-sqlite3 ok')"

      # `--test-concurrency=1`: the suite writes to shared paths when it has to
      # (the config tests write an .env, the demo-guard tests compare against the
      # real data directory), and node --test runs the files in parallel by
      # default. That combination produced a failure that passed alone and only
      # appeared in the full run - a good reminder that "works on my machine" is a
      # statement about concurrency as much as about versions.
      - name: Test
        working-directory: app
        run: node --test --test-concurrency=1 --test-reporter=spec

  config:
    name: Configuration documentation is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_MIN }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # Asserts both directions, so this catches a variable that was added to
      # config.js and never documented as well as one that was documented and
      # stopped being read. Both are silent failures at runtime.
      - name: .env.example matches src/config.js
        working-directory: app
        run: node --test --test-reporter=spec test/config.test.js

      - name: Every documented variable parses as configuration
        working-directory: app
        run: |
          cp .env.example .env
          node -e "
            import('./src/config.js').then(({ loadConfig }) => {
              const config = loadConfig();
              if (!config.port || !config.dataDir || !config.privacy.kThreshold) {
                console.error('the example file did not produce a usable config');
                process.exit(1);
              }
              console.log('.env.example loads: port', config.port, '| k', config.privacy.kThreshold);
            });
          "

  image:
    name: Container builds and answers its healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build is the check. A Dockerfile that has never been built is a
      # Dockerfile that does not work, and on a project with a native dependency
      # the first thing that breaks is the install step inside the image.
      - name: Build
        run: docker build -t kampala-intel:ci ./app

      # Starts it, waits for the healthcheck to pass, and then asserts on the
      # response. The healthcheck is the image's own - the same
      # `curl /api/v1/meta` an operator would use - so this proves the image is
      # genuinely serving, not merely running.
      - name: Run and wait for healthy
        run: |
          docker volume create cip-data
          docker run -d --name cip-app \
            -v cip-data:/data \
            -e KIP_DATA_DIR=/data \
            -e KIP_HOST=0.0.0.0 \
            -p 4310:4310 \
            kampala-intel:ci

          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cip-app 2>/dev/null || echo starting)
            case "$status" in
              healthy) echo "healthy after ${attempt} checks"; exit 0 ;;
              unhealthy) echo "--- container logs ---"; docker logs cip-app; exit 1 ;;
            esac
            sleep 2
          done

          echo "--- container logs ---"
          docker logs cip-app
          exit 1

      - name: The API answers, and reports its own privacy floor
        run: |
          curl -fsS http://127.0.0.1:4310/api/v1/meta | tee /tmp/meta.json
          node -e "
            const meta = require('/tmp/meta.json');
            if (meta.privacy?.kThreshold !== 5) {
              console.error('unexpected privacy floor:', meta.privacy?.kThreshold);
              process.exit(1);
            }
            if (!meta.counts || meta.counts.locations === undefined) {
              console.error('the reference data was not seeded in the container');
              process.exit(1);
            }
            console.log('meta ok:', meta.counts.locations, 'locations, k =', meta.privacy.kThreshold);
          "

      # The stop path is part of the image's contract: `docker stop` sends
      # SIGTERM, src/server.js closes Fastify and checkpoints SQLite on it, and a
      # SIGKILL instead would leave a `-wal` file for the next start to recover.
      # So stop it the documented way and check what the shutdown left behind.
      - name: A clean stop checkpoints the WAL away
        run: |
          docker stop -t 15 cip-app
          echo "--- data directory after shutdown ---"
          docker run --rm -v cip-data:/data alpine ls -l /data

          # SQLite leaves a zero-length -wal file behind after a TRUNCATE
          # checkpoint; that is clean. A -wal with bytes in it means the process
          # was killed before closeDatabase could fold the writes into the main
          # file, and the next start has to recover them.
          outstanding=$(docker run --rm -v cip-data:/data alpine sh -c \
            'find /data -name "*-wal" -size +0c | wc -l')
          echo "WAL files with unflushed bytes: ${outstanding}"
          [ "$outstanding" = "0" ] || {
            echo "SIGTERM was not handled cleanly; SQLite was killed mid-checkpoint"
            exit 1
          }

      # And the backup path works against that same volume, which is the only way
      # to prove the data directory is reachable from a second container.
      - name: Backup and restore work against the volume
        run: |
          docker run --rm -v cip-data:/data \
            -e KIP_DATA_DIR=/data \
            kampala-intel:ci node scripts/backup.js --keep 2
          docker run --rm -v cip-data:/data \
            -e KIP_DATA_DIR=/data \
            kampala-intel:ci node scripts/backup.js --verify

      - name: Logs if anything failed
        if: failure()
        run: docker logs cip-app || true

      - name: Clean up
        if: always()
        run: docker rm -f cip-app || true