# Kampala Businesses Intel - reverse proxy
#
# nginx in front of the Node service. Included because the deployment pieces are
# not finished without it: the app binds 127.0.0.1 and speaks plain HTTP, so TLS,
# the real client address, and the request size limit all live here.
#
#   sudo cp deploy/nginx-kampala-intel.conf /etc/nginx/sites-available/kampala-intel
#   sudo ln -s /etc/nginx/sites-available/kampala-intel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# With this in place, set KIP_TRUST_PROXY=true in the service, because nginx is
# then the thing setting X-Forwarded-For and the rate limiter needs to believe it.

# Rate limits that match the ones in src/config.js, applied at the edge so a
# burst is dropped before it costs a database connection.
#
# The sign-in limit is per address and deliberately tight: it is the one endpoint
# worth guessing at, and 10 attempts per 15 minutes is the ceiling the app also
# enforces. Having both means the limit holds even if the app's own is bypassed.
limit_req_zone $binary_remote_addr zone=kampala_search:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kampala_request:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=kampala_signin:10m rate=10r/15m;
limit_req_zone $binary_remote_addr zone=kampala_read:10m rate=240r/m;

server {
    listen 80;
    listen [::]:80;
    server_name intel.example.ug;

    # ACME challenges for certificate renewal. Served from here, with nothing
    # proxied, because the renewal client has to reach a real file over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name intel.example.ug;

    ssl_certificate     /etc/letsencrypt/live/intel.example.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intel.example.ug/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A business profile is a few hundred characters. The app's own limit is
    # 256 KiB; matching it here means an oversized body is rejected by nginx
    # before it is read off the socket, rather than streamed in and then refused.
    client_max_body_size 256k;

    # The same address for every request, and the reason KIP_TRUST_PROXY can be
    # true. Without these two lines nginx sends its own address and the app's
    # rate limiter counts every visitor as one client.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads are not a thing here, so nothing should ever be buffered to disk
    # waiting for a body that will not arrive.
    proxy_request_buffering on;
    proxy_read_timeout 60s;

    # --- Public read traffic ------------------------------------------------
    # Search is the endpoint that costs real work: one FTS query plus, on a gap,
    # a demand measurement. It carries both limits, the tighter one winning.
    location = /api/v1/search {
        limit_req zone=kampala_search burst=10 nodelay;
        proxy_pass http://127.0.0.1:4310;
    }

    # Everything else public. `/insights/*` is public and deliberately so - it is
    # the published view of the gaps - and it is already k-anonymity filtered
    # inside the app, so there is nothing here to suppress.
    location ~ ^/api/v1/(businesses|insights|meta|locations|categories|skills|counts)(/|$) {
        limit_req zone=kampala_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:4310;
    }

    # --- Anonymous marketplace writes ---------------------------------------
    # The one endpoint an unauthenticated visitor may POST to, and the tightest
    # limit on the public site: 5 per minute, matching KIP_API's request window in
    # src/config.js.
    location ~ ^/api/v1/requests(/|$) {
        limit_req zone=kampala_request burst=5 nodelay;
        proxy_pass http://127.0.0.1:4310;
    }

    # --- Sign-in ------------------------------------------------------------
    # `/operator.html` is the page, `/api/v1/auth/login` is the POST behind it, and
    # both are limited: an attacker walking passwords hits the API, and the page is
    # what a human sees when the limit trips, so a 429 there is the honest answer.
    location ~ ^/(operator\.html|api/v1/auth/login)$ {
        limit_req zone=kampala_signin burst=3 nodelay;
        proxy_pass http://127.0.0.1:4310;
    }

    # --- Everything else ----------------------------------------------------
    location / {
        limit_req zone=kampala_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:4310;
    }
}