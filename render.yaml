# Render Blueprint - one web service running the app, reachable at
# kbi.kampalabiz.space.
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repository.
# Render reads this file, creates the service and shows the onrender.com target
# to CNAME at the DNS provider (see DEPLOY.md, "PaaS deployment").
#
# This is the free shape: `plan: free` is what lets a Blueprint deploy without a
# card, and free web services cannot attach a persistent disk, so there is no
# disk here and SQLite lives on the container's own filesystem. Every redeploy,
# restart or idle spin-down starts from an empty database. That is fine for a
# demonstration and wrong for anything that must keep its data; to keep it, move
# to `plan: starter` and add back the disk block (name / mountPath / sizeGB) -
# see DEPLOY.md, "PaaS deployment".
#
# The Dockerfile lives in app/, so both the path and the build context point
# there. The image already sets NODE_ENV, KIP_HOST, KIP_PORT and KIP_DATA_DIR;
# only the values a platform must decide are listed here.

services:
  - type: web
    name: kampala-intel
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /api/v1/meta
    envVars:
      # Render forwards public traffic to this port. It must match the KIP_PORT
      # the image binds (4310); Render's own default is 10000.
      - key: PORT
        value: "4310"
      # Render terminates TLS and sets X-Forwarded-For, so the app may trust it.
      # Correct only because a real proxy is in front; see README.md.
      - key: KIP_TRUST_PROXY
        value: "true"
      # A public install must not ship the demonstration traders.
      - key: KIP_SEED_CATALOGUE_DEMO
        value: "false"
      # Render has no systemd timer, so the server runs the nightly demand rollup,
      # gap measurement, retention purge and backup itself. On a host these are
      # `deploy/kampala-intel-*.timer` and this stays unset, or the work happens
      # twice.
      - key: KIP_OPS_SCHEDULE
        value: "true"
      # Render has no timer for harvest; the server re-harvests plans that declare a
      # cadence on its own schedule.
      - key: KIP_HARVEST_SCHEDULE
        value: "true"
      # Generated once by Render and kept, so sessions survive a redeploy.
      - key: KIP_SESSION_SECRET
        generateValue: true
      # The first operator account, created at boot because free has no shell to
      # run `create-admin`. Edit the email before deploying; Render generates the
      # password and keeps it, so read it back from the Environment tab to sign in
      # and then change it. The server only creates an account when there is none
      # yet, so these never replace a real operator afterwards.
      - key: KIP_ADMIN_EMAIL
        value: "you@example.com"
      - key: KIP_ADMIN_PASSWORD
        generateValue: true
